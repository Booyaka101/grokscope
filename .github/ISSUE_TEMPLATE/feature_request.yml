name: Feature request
description: Suggest something grokscope should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Sends your query to xAI and caches the response locally. The cache is a plain file: treat it like shell history.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
